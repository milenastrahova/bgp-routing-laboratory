name: Static validation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Unit tests and static invariants
        run: python -m unittest discover -s tests -v
      - name: Docker Compose schema
        run: docker compose -f compose.yaml config --quiet
