frr defaults traditional
hostname core
service integrated-vtysh-config
log stdout informational
!
interface lo
 ip address 10.40.40.1/32
!
ip prefix-list EDGE-OWN seq 10 permit 10.10.10.1/32
ip prefix-list CORE-SERVICE seq 10 permit 10.40.40.1/32
!
route-map CORE-OUT permit 10
 match ip address prefix-list CORE-SERVICE
!
route-map EDGE-FROM-PRIMARY permit 10
 match ip address prefix-list EDGE-OWN
 set local-preference 200
!
route-map EDGE-FROM-BACKUP permit 10
 match ip address prefix-list EDGE-OWN
 set local-preference 100
!
router bgp 65040
 bgp router-id 10.40.40.1
 no bgp default ipv4-unicast
 neighbor 10.255.30.2 remote-as 65020
 neighbor 10.255.30.2 description transit-primary
 neighbor 10.255.30.2 timers 3 9
 neighbor 10.255.40.2 remote-as 65030
 neighbor 10.255.40.2 description transit-backup
 neighbor 10.255.40.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.40.40.1/32
  neighbor 10.255.30.2 activate
  neighbor 10.255.30.2 route-map EDGE-FROM-PRIMARY in
  neighbor 10.255.30.2 route-map CORE-OUT out
  neighbor 10.255.40.2 activate
  neighbor 10.255.40.2 route-map EDGE-FROM-BACKUP in
  neighbor 10.255.40.2 route-map CORE-OUT out
 exit-address-family
!
line vty
