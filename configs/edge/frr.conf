frr defaults traditional
hostname edge
service integrated-vtysh-config
log stdout informational
!
interface lo
 ip address 10.10.10.1/32
!
ip prefix-list EDGE-OWN seq 10 permit 10.10.10.1/32
ip prefix-list CORE-SERVICE seq 10 permit 10.40.40.1/32
!
route-map EDGE-OUT permit 10
 match ip address prefix-list EDGE-OWN
!
route-map CORE-FROM-PRIMARY permit 10
 match ip address prefix-list CORE-SERVICE
 set local-preference 200
!
route-map CORE-FROM-BACKUP permit 10
 match ip address prefix-list CORE-SERVICE
 set local-preference 100
!
router bgp 65010
 bgp router-id 10.10.10.1
 no bgp default ipv4-unicast
 neighbor 10.255.10.3 remote-as 65020
 neighbor 10.255.10.3 description transit-primary
 neighbor 10.255.10.3 timers 3 9
 neighbor 10.255.20.3 remote-as 65030
 neighbor 10.255.20.3 description transit-backup
 neighbor 10.255.20.3 timers 3 9
 !
 address-family ipv4 unicast
  network 10.10.10.1/32
  neighbor 10.255.10.3 activate
  neighbor 10.255.10.3 route-map CORE-FROM-PRIMARY in
  neighbor 10.255.10.3 route-map EDGE-OUT out
  neighbor 10.255.20.3 activate
  neighbor 10.255.20.3 route-map CORE-FROM-BACKUP in
  neighbor 10.255.20.3 route-map EDGE-OUT out
 exit-address-family
!
line vty
