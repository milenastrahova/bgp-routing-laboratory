frr defaults traditional
hostname transit-backup
service integrated-vtysh-config
log stdout informational
!
ip prefix-list EDGE-OWN seq 10 permit 10.10.10.1/32
ip prefix-list CORE-SERVICE seq 10 permit 10.40.40.1/32
!
route-map ONLY-EDGE permit 10
 match ip address prefix-list EDGE-OWN
!
route-map ONLY-CORE permit 10
 match ip address prefix-list CORE-SERVICE
!
router bgp 65030
 bgp router-id 10.30.30.1
 no bgp default ipv4-unicast
 neighbor 10.255.20.2 remote-as 65010
 neighbor 10.255.20.2 description edge
 neighbor 10.255.20.2 timers 3 9
 neighbor 10.255.40.3 remote-as 65040
 neighbor 10.255.40.3 description core
 neighbor 10.255.40.3 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.255.20.2 activate
  neighbor 10.255.20.2 route-map ONLY-EDGE in
  neighbor 10.255.20.2 route-map ONLY-CORE out
  neighbor 10.255.40.3 activate
  neighbor 10.255.40.3 route-map ONLY-CORE in
  neighbor 10.255.40.3 route-map ONLY-EDGE out
 exit-address-family
!
line vty
